<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Stock Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --accent: #c27ba0; --accent-dark: #9c5f80; --ink: #2b2230; --bg: #faf6f8; --card: #fff; --border: #e6d9df; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); margin: 0; padding: 0; }
  .header { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: white; padding: 20px; text-align: center; }
  .header h2 { margin: 0; font-size: 18px; }
  .container { padding: 16px; max-width: 460px; margin: 0 auto; }
  #reader { width: 100%; border-radius: 10px; overflow: hidden; }
  label { display: block; margin-top: 10px; font-weight: 600; font-size: 12.5px; color: #6b5b64; }
  input, select { width: 100%; padding: 9px; margin-top: 4px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
  button.main { margin-top: 14px; width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-top: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: none; }
  #result { margin-top: 12px; padding: 10px; background: #f6e9f0; border-radius: 8px; display: none; }
  #scannedCode { text-align: center; font-weight: 600; margin-top: 8px; }
</style>
</head>
<body>

<div class="header"><h2>📷 Shop Stock Scanner</h2></div>

<div class="container">
  <div id="reader"></div>
  <div id="scannedCode"></div>

  <div id="knownProductCard" class="card">
    <div id="knownProductName" style="font-weight:600;"></div>
    <label>Quantity to add to stock</label>
    <input type="number" id="restockQty" value="1" min="1">
    <button class="main" onclick="doRestock()">Add to Stock</button>
  </div>

  <div id="newProductCard" class="card">
    <div>No product found for this barcode. Add it as new:</div>
    <label>Product Name</label>
    <input type="text" id="np-name">
    <label>Category</label>
    <input type="text" id="np-category">
    <label>Cost Price (GHS)</label>
    <input type="number" id="np-cost">
    <label>Selling Price (GHS)</label>
    <input type="number" id="np-selling">
    <label>Opening Stock</label>
    <input type="number" id="np-stock" value="0">
    <label>Reorder Level</label>
    <input type="number" id="np-reorder" value="5">
    <button class="main" onclick="doAddNew()">Add New Product</button>
  </div>

  <div id="result"></div>
</div>

<script>
  // PASTE YOUR APPS SCRIPT WEB APP URL HERE (ends in /exec)
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzuA913XOUJhmHnJFv5fCw8UOfBWErgj4RQARZ6c0Rey_kcKq1n72Psy3v4bQALKB1O/exec";

  let currentSku = '';

  function onScanSuccess(decodedText) {
    currentSku = decodedText;
    document.getElementById('scannedCode').innerText = 'Scanned: ' + decodedText;
    document.getElementById('knownProductCard').style.display = 'none';
    document.getElementById('newProductCard').style.display = 'none';
    document.getElementById('result').style.display = 'none';

    fetch(WEB_APP_URL + '?action=lookup&sku=' + encodeURIComponent(decodedText))
      .then(res => res.json())
      .then(data => {
        if (data.found) {
          document.getElementById('knownProductName').innerText = data.name + ' (current opening stock: ' + data.openingStock + ')';
          document.getElementById('knownProductCard').style.display = 'block';
        } else {
          document.getElementById('newProductCard').style.display = 'block';
        }
      })
      .catch(err => alert('Error: ' + err.message));
  }

  const html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 220 }, onScanSuccess);

  function doRestock() {
    const qty = document.getElementById('restockQty').value;
    fetch(WEB_APP_URL + '?action=restock&sku=' + encodeURIComponent(currentSku) + '&qty=' + qty)
      .then(res => res.json())
      .then(data => {
        const div = document.getElementById('result');
        div.style.display = 'block';
        div.innerText = data.success ? ('Stock updated: ' + data.name + ' now at ' + data.newOpeningStock) : data.message;
      })
      .catch(err => alert('Error: ' + err.message));
  }

  function doAddNew() {
    const params = new URLSearchParams({
      action: 'addNew',
      sku: currentSku,
      name: document.getElementById('np-name').value,
      category: document.getElementById('np-category').value,
      cost: document.getElementById('np-cost').value,
      selling: document.getElementById('np-selling').value,
      stock: document.getElementById('np-stock').value,
      reorder: document.getElementById('np-reorder').value
    });

    fetch(WEB_APP_URL + '?' + params.toString())
      .then(res => res.json())
      .then(data => {
        const div = document.getElementById('result');
        div.style.display = 'block';
        div.innerText = data.success ? 'New product added successfully.' : data.message;
      })
      .catch(err => alert('Error: ' + err.message));
  }
</script>
</body>
</html>
